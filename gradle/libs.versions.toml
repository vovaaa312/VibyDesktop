[versions]
kotlin = "2.4.21"
compose = "1.12.2"
coroutines = "1.11.0"
material3 = "1.9.0"
materialIcons = "1.7.3"
json = "20260814"
jspecify = "1.0.0"
jnativehook = "2.2.2"
sqlite = "3.54.1.0"
junit = "6.1.3"

[libraries]
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }
jnativehook = { group = "com.github.kwhat", name = "jnativehook", version.ref = "jnativehook" }
json = { group = "org.json", name = "json", version.ref = "json" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }
material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "material3" }
material-icons-extended = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }
coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
