name: release

# Push a tag like v1.0.0 to build installers for all platforms and publish them as a GitHub
# release. The in-app updater reads the latest release and verifies the SHA-256 digest GitHub
# reports for each asset. "Run workflow" adds installers to an existing release: it builds the
# code of the given tag for the chosen platforms only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v1.0.1
        required: true
      platforms:
        description: Comma separated - windows, macos, linux
        default: macos, linux

permissions:
  contents: write

env:
  RELEASE_PLATFORMS: ${{ inputs.platforms || 'windows, macos, linux' }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # a typed tag may lack the v or carry spaces: "1.0.1 " -> v1.0.1
      - id: tag
        shell: bash
        run: |
          tag=$(echo "$RELEASE_TAG" | tr -d "[:space:]")
          [[ "$tag" == v* ]] || tag="v$tag"
          if ! git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}.git" "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag does not exist"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: pick
        shell: bash
        run: |
          node -e '
            const all = [
              { platform: "windows", os: "windows-latest", task: "packageMsi", files: "app/build/compose/binaries/main/msi/*.msi" },
              { platform: "macos", os: "macos-latest", task: "packageDmg", files: "app/build/compose/binaries/main/dmg/*.dmg" },
              { platform: "linux", os: "ubuntu-latest", task: "packageDeb", files: "app/build/compose/binaries/main/deb/*.deb" },
            ];
            const wanted = process.env.RELEASE_PLATFORMS.split(",").map(p => p.trim());
            console.log("matrix=" + JSON.stringify({ include: all.filter(p => wanted.includes(p.platform)) }));
          ' >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Desktop OAuth client for Google sign-in. A build without it has no "Аккаунт Google" and no
      # "Мои плейлисты YouTube", so a release must not be published without the secret (1.2.0 was).
      - name: Google OAuth client
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
        run: |
          if [ -z "$GOOGLE_OAUTH_CLIENT" ]; then
            echo "::error::Repository secret GOOGLE_OAUTH_CLIENT is not set: the installers would have no Google sign-in. Set it to the contents of client_secret.json and re-run."
            exit 1
          fi
          printf '%s' "$GOOGLE_OAUTH_CLIENT" > client_secret.json
      - run: ./gradlew test :app:${{ matrix.task }} --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: ${{ matrix.files }}
          generate_release_notes: true
