name: release

# Push a tag like v1.0.0 to build installers and publish them as a GitHub release. The in-app
# updater reads the latest release and verifies the SHA-256 digest GitHub reports for each asset.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # installers to build, comma separated: windows, macos, linux
  RELEASE_PLATFORMS: windows

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          node -e '
            const all = [
              { platform: "windows", os: "windows-latest", task: "packageMsi", files: "app/build/compose/binaries/main/msi/*.msi" },
              { platform: "macos", os: "macos-latest", task: "packageDmg", files: "app/build/compose/binaries/main/dmg/*.dmg" },
              { platform: "linux", os: "ubuntu-latest", task: "packageDeb", files: "app/build/compose/binaries/main/deb/*.deb" },
            ];
            const wanted = process.env.RELEASE_PLATFORMS.split(",").map(p => p.trim());
            console.log("matrix=" + JSON.stringify({ include: all.filter(p => wanted.includes(p.platform)) }));
          ' >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Desktop OAuth client for Google sign-in; builds without the secret hide sign-in
      - name: Google OAuth client
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
        run: |
          if [ -n "$GOOGLE_OAUTH_CLIENT" ]; then printf '%s' "$GOOGLE_OAUTH_CLIENT" > client_secret.json; fi
      - run: ./gradlew test :app:${{ matrix.task }} --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
